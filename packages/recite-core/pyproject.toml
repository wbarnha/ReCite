[project]
name = "recite-core"
version = "0.1.0"
description = "Citation model, extraction and reference-data lookups for ReCite."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../../LICENSE" }
authors = [{ name = "The ReCite contributors" }]
keywords = ["law", "citations", "eyecite", "bluebook", "free law project"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "courts-db>=0.10.26",
    "eyecite>=2.7.0",
    "reporters-db>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recite"]

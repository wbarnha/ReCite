[project]
name = "recite-cli"
version = "0.1.0"
description = "The `recite` command line interface."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../../LICENSE" }
authors = [{ name = "The ReCite contributors" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "recite-core",
    "recite-fix",
    "recite-rules",
    "recite-verify",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
recite = "recite.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recite"]

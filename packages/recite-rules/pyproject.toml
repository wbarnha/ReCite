[project]
name = "recite-rules"
version = "0.1.0"
description = "The rule set that decides when a case law citation is wrong."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../../LICENSE" }
authors = [{ name = "The ReCite contributors" }]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["recite-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recite"]

[project]
name = "recite-workspace"
version = "0.1.0"
description = "Workspace root for ReCite, a toolkit for finding and fixing case law citations."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
recite-core = { workspace = true }
recite-rules = { workspace = true }
recite-verify = { workspace = true }
recite-fix = { workspace = true }
recite-cli = { workspace = true }

[dependency-groups]
dev = [
    "recite-core",
    "recite-rules",
    "recite-verify",
    "recite-fix",
    "recite-cli",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# Shared tool configuration. Every package inherits this by virtue of the tools
# discovering the workspace root, so per-package pyproject files stay minimal.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008", # typer uses function calls in argument defaults by design
]

# ReCite prints legal prose, so en dashes in year ranges ("1993–present") and
# curly apostrophes in reporter names are deliberate, not typos.
allowed-confusables = ["–", "—", "’"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = [
    "packages/recite-core/src",
    "packages/recite-rules/src",
    "packages/recite-verify/src",
    "packages/recite-fix/src",
    "packages/recite-cli/src",
]
namespace_packages = true
explicit_package_bases = true
# Test bodies are checked by running them, not by annotating every fixture.
exclude = ["packages/[^/]+/tests/"]

[[tool.mypy.overrides]]
module = ["eyecite.*", "courts_db.*", "reporters_db.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access to the CourtListener API",
]

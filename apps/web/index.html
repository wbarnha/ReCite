<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No script, style, image or connection may come from anywhere but this
      origin and Microsoft's Office CDN. The page never contacts a server of
      its own, so `connect-src` is closed entirely; a bug or a compromised
      dependency cannot quietly post the document somewhere.

      `frame-ancestors` is deliberately absent: it is ignored when delivered in
      a meta element, so including it would only log an error. Framing has to
      be restricted by an HTTP header, which GitHub Pages cannot set — and the
      Word task pane is itself framed by Office, so the policy would need to
      permit that anyway. See docs/security.md.
    -->
    <!--
      `script-src 'self'` with no CDN: the web app does not load office.js, and
      only the task pane does. Listing Microsoft's origin here anyway would
      have permitted a request this page never makes, which is the difference
      between a privacy claim that is true and one the browser enforces.

      `connect-src 'self'` and not 'none', which the task pane still uses.
      Reading a scanned PDF means running an OCR engine, and a WebAssembly
      engine has to be fetched before it can run. Restricting it to this origin
      keeps the guarantee that matters — the browser will still refuse any
      cross-origin request, so document text cannot leave — while allowing the
      app to load its own code. The OCR language models are published beside
      the app for the same reason: Scribe's default is to pull them from a CDN,
      which would have put a third party in the path of a document check.
      See docs/security.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <title>ReCite — find and fix broken case law citations</title>
    <meta
      name="description"
      content="Check legal writing for citation errors: impossible reporter/year pairings, non-precedential authority, inconsistent abbreviations, and citations absent from your authority list. Runs entirely in your browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%C2%A7%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

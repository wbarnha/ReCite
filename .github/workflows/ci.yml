name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

# CI only reads the repository. Stating it here means a workflow change that
# needs more has to say so explicitly, in a diff someone reviews.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint, types, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # What reaches a user's browser. The three packages have no runtime
      # dependencies at all, so this covers React and React DOM and nothing
      # else. Any advisory here is a vulnerability in the shipped product.
      - name: Audit what ships
        run: pnpm audit --prod --audit-level low

      # Build and test tooling. It never reaches a user, but it does run on
      # maintainer machines and on this runner with access to the token, so a
      # compromise here is a supply-chain compromise of the release.
      - name: Audit the toolchain
        run: pnpm audit --audit-level moderate

      # A dependency added without the lockfile being updated, or a lockfile
      # edited by hand, would otherwise be installed silently.
      - name: The lockfile matches the manifests
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Report what actually ships
        run: |
          {
            echo "### Runtime dependency tree"
            echo ""
            echo '```'
            pnpm --filter @recite/web list --prod --depth 2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life in April 2026 and stopped receiving
        # security patches, so it is no longer a version to certify against.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage/lcov.info

  browser:
    name: the built site in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser tests read `dist/`, so it has to exist — including the
      # OCR language model, which `build:release` publishes.
      - run: pnpm build:release

      # Two things only a real browser can answer: that OCR actually turns a
      # scanned page into readable citations, and that nothing the app does
      # leaves the origin. The second matters because Scribe's CDN fallback is
      # still a string in the bundle — the override has to be observed, not
      # assumed.
      - run: pnpm test:browser
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

  build:
    name: build and verify checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:release

      # The build must be verifiable by the same tool anyone else would use,
      # not only by our own script.
      - name: Verify with our tool
        run: pnpm verify:checksums
      - name: Verify with sha256sum
        working-directory: apps/web/dist
        run: sha256sum -c checksums.sha256

      - name: Every local asset carries an integrity hash
        run: |
          for page in apps/web/dist/index.html apps/web/dist/taskpane.html; do
            unpinned=$(grep -oE '<(script|link)[^>]*(src|href)="[^"]*assets/[^"]*"[^>]*>' "$page" \
              | grep -v 'integrity=' || true)
            if [ -n "$unpinned" ]; then
              echo "::error file=$page::asset without subresource integrity:"
              echo "$unpinned"
              exit 1
            fi
          done

      - name: Manifest is well-formed and points at HTTPS
        run: |
          python3 -c "
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse('apps/web/dist/manifest.xml')
          ns = {'o': 'http://schemas.microsoft.com/office/appforoffice/1.1'}
          version = tree.find('o:Version', ns).text
          assert version.count('.') == 3, f'Office needs a four-part version, got {version}'
          for element in tree.iter():
              value = element.get('DefaultValue', '')
              if value.startswith('http') and not value.startswith('https://'):
                  sys.exit(f'non-HTTPS URL in manifest: {value}')
          print(f'manifest.xml OK, version {version}')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist
